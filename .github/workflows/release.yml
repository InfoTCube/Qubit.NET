name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: write   # required to create the GitHub release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Source Link needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Qubit.NET/Qubit.NET.csproj --no-build --configuration Release
          -p:Version=${{ env.VERSION }} --output ./artifacts

      # Exchanges a GitHub OIDC token for a NuGet API key that lasts one hour, so no
      # long-lived key is ever stored. Must run immediately before the push.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
